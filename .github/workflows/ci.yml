name: CI

permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-smoke:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'uecb-shared' }}
    timeout-minutes: 30
    steps:
      - name: Ensure base toolchain (uecb-shared image lacks it)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Stopgap until ghcr.io/josh-archer/shared-runner (home gitops/images/shared-runner) is published and pinned.
          missing=""
          for t in make gcc g++ ruby wget pkg-config; do command -v "$t" >/dev/null 2>&1 || missing="$missing $t"; done
          if [ -n "$missing" ] && command -v apt-get >/dev/null 2>&1; then
            echo "Installing missing tools:$missing"
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
            $SUDO apt-get update -qq
            $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends build-essential pkg-config ruby wget ca-certificates
          fi
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Same compiler major as the image builder (Dockerfile rust:1.88).
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88

      - name: Cache cargo
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Unit and entrypoint tests
        run: cargo test --locked

      - name: Build shipped binary
        run: cargo build --release --locked

      # The Dockerfile copies target/release/notification-api into the image.
      # Smoke that file with a local fixture. No registry push and no live calls.
      - name: Smoke-test shipped entrypoint
        run: |
          set -euo pipefail
          grep -q 'target/release/notification-api' Dockerfile
          bash scripts/smoke-entrypoint.sh target/release/notification-api
