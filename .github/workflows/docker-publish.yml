name: Build and Publish Docker Image

permissions:
  contents: write
  packages: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
      PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: cargo-version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n1 | sed 's/version = "//;s/"//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag commit with version (if not exists)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          TAG="v${{ steps.cargo-version.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            echo "Tag $TAG already exists on remote. Skipping tag creation and push."
          else
            git tag "$TAG"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" "$TAG"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Primary registry: works with GITHUB_TOKEN (no Docker Hub credentials required).
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR is the sole supported publication registry.
      - name: Resolve image tags
        id: meta
        env:
          VERSION: ${{ steps.cargo-version.outputs.version }}
        run: |
          set -euo pipefail
          OWNER_LC="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          GHCR_IMAGE="ghcr.io/${OWNER_LC}/notification-api"
          TAGS="${GHCR_IMAGE}:${VERSION}"$'\n'"${GHCR_IMAGE}:latest"
          {
            echo "tags<<EOF"
            printf '%s\n' "$TAGS"
            echo "EOF"
            echo "ghcr_image=${GHCR_IMAGE}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved GHCR tags:"
          printf '%s\n' "$TAGS"

      # Multi-stage Dockerfile builds the Rust binary inside the image for each platform.
      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PUSHOVER_TOKEN=${{ secrets.PUSHOVER_TOKEN }}
            PUSHOVER_USER=${{ secrets.PUSHOVER_USER }}

      - name: Summarize publish target
        env:
          VERSION: ${{ steps.cargo-version.outputs.version }}
          GHCR_IMAGE: ${{ steps.meta.outputs.ghcr_image }}
        run: |
          printf '### Publish summary\n- Version: %s\n- Platforms: linux/amd64,linux/arm64\n- Canonical registry: %s (GHCR only)\n' \
            "$VERSION" "$GHCR_IMAGE" >> "$GITHUB_STEP_SUMMARY"
