name: Build and Publish Docker Image

permissions:
  contents: write
  packages: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
      PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: cargo-version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n1 | sed 's/version = "//;s/"//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag commit with version (if not exists)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          TAG="v${{ steps.cargo-version.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            echo "Tag $TAG already exists on remote. Skipping tag creation and push."
          else
            git tag "$TAG"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" "$TAG"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Primary registry: works with GITHUB_TOKEN (no Docker Hub credentials required).
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Secondary registry: optional. Wrong/expired DOCKER_* secrets must not block GHCR publish.
      - name: Log in to Docker Hub
        id: dockerhub_login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve image tags
        id: meta
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          VERSION: ${{ steps.cargo-version.outputs.version }}
          DOCKERHUB_OUTCOME: ${{ steps.dockerhub_login.outcome }}
        run: |
          set -euo pipefail
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          GHCR_IMAGE="ghcr.io/${OWNER_LC}/notification-api"
          TAGS="${GHCR_IMAGE}:${VERSION}"$'\n'"${GHCR_IMAGE}:latest"
          if [ "${DOCKERHUB_OUTCOME}" = "success" ] && [ -n "${DOCKER_USERNAME:-}" ]; then
            TAGS="${TAGS}"$'\n'"${DOCKER_USERNAME}/notification-api:${VERSION}"$'\n'"${DOCKER_USERNAME}/notification-api:latest"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub login failed or DOCKER_USERNAME/DOCKER_PASSWORD missing/invalid. Publishing multi-arch image to GHCR only (${GHCR_IMAGE}). Fix repo secrets: DOCKER_USERNAME (Docker Hub username) and DOCKER_PASSWORD (Docker Hub Access Token with Read & Write, not the account password)."
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "$TAGS"
            echo "EOF"
            echo "ghcr_image=${GHCR_IMAGE}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tags:"
          printf '%s\n' "$TAGS"

      # Multi-stage Dockerfile builds the Rust binary inside the image for each platform.
      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PUSHOVER_TOKEN=${{ secrets.PUSHOVER_TOKEN }}
            PUSHOVER_USER=${{ secrets.PUSHOVER_USER }}

      - name: Summarize publish targets
        run: |
          echo "### Publish summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ steps.cargo-version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platforms: \`linux/amd64,linux/arm64\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- GHCR: \`${{ steps.meta.outputs.ghcr_image }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.meta.outputs.dockerhub }}" = "true" ]; then
            echo "- Docker Hub: published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Docker Hub: **skipped** (update DOCKER_USERNAME / DOCKER_PASSWORD — use an Access Token)" >> "$GITHUB_STEP_SUMMARY"
          fi
